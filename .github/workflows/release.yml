name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: refs/tags/${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -Dwarnings
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((alpha|beta|rc)\.[1-9][0-9]*))?$ ]]; then
            echo "::error::invalid SemVer release tag: $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          manifest_version="$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.toml","rb")); v=d.get("package",{}).get("version"); print(v if isinstance(v, str) else d.get("workspace",{}).get("package",{}).get("version",""))')"
          if [[ -z "$manifest_version" || "$manifest_version" != "$version" ]]; then
            echo "::error::release tag $RELEASE_TAG does not match Cargo.toml version ${manifest_version:-missing}"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
            echo "::error::checked out commit does not match release tag $RELEASE_TAG"
            exit 1
          fi
          if git cat-file -e HEAD:.githooks/commit-msg 2>/dev/null; then
            subject="$(git log -1 --format=%s)"
            expected_subject="chore(release): bump to v$version"
            if [[ "$subject" != "$expected_subject" ]]; then
              echo "::error::release commit subject '$subject' does not match '$expected_subject'"
              exit 1
            fi
          fi
          is_prerelease="false"
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            is_prerelease="true"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: false
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: make check

  build:
    uses: ./.github/workflows/build-binaries.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      upload: true

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Verify release commit
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -eu
          if [ "$(git rev-parse HEAD)" != "$VALIDATED_SHA" ]; then
            echo "::error::release tag moved after validation"
            exit 1
          fi
          for built in recall-*.sha; do
            sha="$(tr -d '[:space:]' < "$built")"
            if [ "$sha" != "$VALIDATED_SHA" ]; then
              echo "::error::$built was built from $sha, not from validated commit $VALIDATED_SHA"
              exit 1
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.check.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; attaching binaries to it"
            gh release upload "$tag" --clobber recall-*.tar.gz recall-*.zip
            exit 0
          fi
          if [[ -s release-notes.md ]]; then
            notes_args=(--notes-file release-notes.md)
          else
            notes_args=(--generate-notes)
          fi
          release_args=(--verify-tag --title "$tag" "${notes_args[@]}")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$tag" "${release_args[@]}" \
            recall-*.tar.gz recall-*.zip
