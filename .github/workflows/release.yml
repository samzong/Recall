name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: recall-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-15
            artifact: recall-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: recall-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: recall-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz recall
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/recall.exe -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      # release-please already created the tag and the GitHub release with its
      # changelog entry; this job only attaches the built binaries to it.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The tag already carries its changelog entry, written into the
          # release commit by the pre-release hook.
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Creating the release and uploading its assets are separate calls, so
          # a run can leave the release in place with assets missing. Manual
          # dispatch is also documented as the way to reattach binaries to an
          # existing release, and both paths reach this step.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; attaching binaries to it"
            gh release upload "$tag" --clobber recall-*.tar.gz recall-*.zip
            exit 0
          fi
          if [ -s release-notes.md ]; then
            notes_args=(--notes-file release-notes.md)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$tag" --title "$tag" "${notes_args[@]}" \
            recall-*.tar.gz recall-*.zip
