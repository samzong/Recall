name: Release

on:
  # Called by release-please once it has created the release, and manually
  # available so a failed asset upload can be retried without re-tagging.
  # It deliberately does not listen for tag pushes: whether such an event
  # reaches Actions depends on which token created the tag.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: recall-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-15
            artifact: recall-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: recall-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: recall-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz recall
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/recall.exe -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      # release-please already created the tag and the GitHub release with its
      # changelog entry; this job only attaches the built binaries to it.
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag does not exist; nothing to attach binaries to" >&2
            exit 1
          fi
          gh release upload "$tag" --clobber recall-*.tar.gz recall-*.zip
