name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: refs/tags/${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -eu
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ] || [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::release tag $RELEASE_TAG does not match Cargo.toml version ${version:-missing}"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]; then
            echo "::error::checked out commit does not match release tag $RELEASE_TAG"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked --version 0.22.2
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ hashFiles('Cargo.lock') }}
      - run: make check

  build:
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: recall-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-15
            artifact: recall-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: recall-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: recall-windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz recall
          cd ../../..

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/recall.exe -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Verify release commit
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.check.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$VALIDATED_SHA" ]; then
            echo "::error::release tag moved after validation"
            exit 1
          fi
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"
          # The tag already carries its changelog entry, written into the
          # release commit by the pre-release hook.
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Creating the release and uploading its assets are separate calls, so
          # a run can leave the release in place with assets missing. Manual
          # dispatch is also documented as the way to reattach binaries to an
          # existing release, and both paths reach this step.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists; attaching binaries to it"
            gh release upload "$tag" --clobber recall-*.tar.gz recall-*.zip
            exit 0
          fi
          if [ -s release-notes.md ]; then
            notes_args=(--notes-file release-notes.md)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$tag" --title "$tag" "${notes_args[@]}" \
            recall-*.tar.gz recall-*.zip
