name: CodSpeed

# Benches measure core hot paths only. Docs, website, skills, and
# extension PRs cannot change those measurements, so they skip this
# job. That skip is safe while "Run benchmarks" is not a required
# status check — if it becomes required, a skipped run stays Pending
# and blocks merge; add a no-op success job before requiring it.
# Force a run from the Actions tab via workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codspeed.yml"
  # Lets CodSpeed trigger backtest runs to build the initial baseline.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # A benchmark comparison is only meaningful when the measurement
      # instrument is identical on both sides, so everything that shapes the
      # generated code or the measurement is pinned to an exact revision. CI's
      # correctness workflow deliberately keeps tracking current stable; this
      # one must not, or a toolchain release would show up as a performance
      # change. Bump these deliberately, on their own commit.
      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: "1.97.1"
          cache-target: release
          bins: cargo-codspeed

      - name: Build the benchmarks
        run: cargo codspeed build --features bench

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@0ca9cbbf4623b599a6c3ed4fc8a922942705d9f1 # v5.0.2
        with:
          mode: simulation
          run: cargo codspeed run
