name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Maintain release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Keeps a release PR open with the next version and the changelog entries
      # for everything merged since the last release. Merging that PR tags the
      # release and creates the GitHub release.
      #
      # RELEASE_PLEASE_TOKEN is a PAT rather than the default GITHUB_TOKEN:
      # events created with GITHUB_TOKEN do not start workflow runs, so the
      # release PR would open with no CI on it.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Build and attach binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Called directly rather than left to the tag push event, which may or may
    # not reach Actions depending on the token that created the tag.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
