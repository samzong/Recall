[package]
name = "rx"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Launch agent harnesses through a configured AI provider"
repository = "https://github.com/samzong/Recall"
publish = false

[package.metadata.release]
release = false

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "6"
fs2 = "0.4"
flate2 = "1"
fuzzy-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
toml = "0.8"
ureq = "3"

[target.'cfg(windows)'.dependencies]
zip = { version = "7", default-features = false, features = ["deflate"] }
