[package]
name = "recall-powercontext"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Backfill Recall sessions into PowerContext Content Sources"
repository = "https://github.com/samzong/Recall"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = "3"
url = "2"
