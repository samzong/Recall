[package]
name = "recall-opendal"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Recall remote storage provider powered by Apache OpenDAL"
license = "Apache-2.0"
publish = false
repository = "https://github.com/samzong/Recall"

[dependencies]
anyhow = "1"
dirs = "6"
opendal = { version = "=0.59.5", features = ["blocking", "services-fs", "services-memory", "services-s3", "services-webdav", "services-b2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
